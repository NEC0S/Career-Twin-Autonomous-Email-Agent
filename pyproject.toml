[project]
name = "agentic-career-email-assistant"
version = "0.1.0"
description = "An autonomous agentic AI system that triages career-related emails and decides between an AI-drafted reply or human escalation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abhishek Kumar" }
]
keywords = [
    "agentic-ai",
    "llm",
    "email-automation",
    "gemini",
    "function-calling",
    "career-tools"
]

dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]